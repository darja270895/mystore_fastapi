services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastapi_app
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - sqlite_data:/app/data
    depends_on:
      - redis
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    command: fastapi dev main.py --host 0.0.0.0 --port 8000

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
        - "6379:6379"
    volumes:
        - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  redis_data:
  sqlite_data: