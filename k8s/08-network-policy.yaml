# Only backend pods may open connections to Redis.
# Enforced only if the cluster's network plugin supports NetworkPolicy
# (kind and minikube with Calico do; Docker Desktop silently ignores it).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-allow-backend-only
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: mystore-api
      ports:
        - protocol: TCP
          port: 6379
