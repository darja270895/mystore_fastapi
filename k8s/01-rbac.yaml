# Identity for backend pods. The /k8s/cluster/* endpoints call the Kubernetes API
# with this ServiceAccount's token, so it may only do what the Role allows.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mystore-api-sa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mystore-cluster-controller
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "create", "patch", "update"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mystore-api-rolebinding
subjects:
  - kind: ServiceAccount
    name: mystore-api-sa
roleRef:
  kind: Role
  name: mystore-cluster-controller
  apiGroup: rbac.authorization.k8s.io
