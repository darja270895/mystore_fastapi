apiVersion: apps/v1
kind: Deployment
metadata:
  name: mystore-api
  labels:
    app: mystore-api
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: mystore-api
  template:
    metadata:
      labels:
        app: mystore-api
    spec:
      serviceAccountName: mystore-api-sa
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: mystore-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: mystore-config
            - secretRef:
                name: mystore-secret
          env:
            # Downward API: read by backend/k8s/k8s_adapters.py::resolve_pod_environment
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: K8S_SERVICE_ACCOUNT
              valueFrom:
                fieldRef:
                  fieldPath: spec.serviceAccountName
          startupProbe:
            httpGet:
              path: /k8s/probes/startupz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /k8s/probes/readyz
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /k8s/probes/livez
              port: http
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                # Lets the Service stop routing to this pod before uvicorn gets SIGTERM.
                command: ["sh", "-c", "sleep 5"]
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: sqlite-data
              mountPath: /app/data
      volumes:
        - name: sqlite-data
          persistentVolumeClaim:
            claimName: sqlite-data
---
# NodePort so Swagger (http://localhost:30800/docs) and curl work from the host.
# The frontend reaches the same pods in-cluster via http://mystore-api:8000.
apiVersion: v1
kind: Service
metadata:
  name: mystore-api
  labels:
    app: mystore-api
spec:
  type: NodePort
  selector:
    app: mystore-api
  ports:
    - name: http
      port: 8000
      targetPort: http
      nodePort: 30800
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mystore-api-pdb
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: mystore-api
