apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mystore

labels:
  - pairs:
      app.kubernetes.io/part-of: mystore
    includeSelectors: false

resources:
  - 00-namespace.yaml
  - 01-rbac.yaml
  - 02-config.yaml
  - 03-redis.yaml
  - 04-sqlite-storage.yaml
  - 05-migrate-job.yaml
  - 06-backend.yaml
  - 07-frontend.yaml
  - 08-network-policy.yaml
