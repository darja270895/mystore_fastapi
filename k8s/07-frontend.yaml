apiVersion: apps/v1
kind: Deployment
metadata:
  name: mystore-frontend
  labels:
    app: mystore-frontend
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: mystore-frontend
  template:
    metadata:
      labels:
        app: mystore-frontend
    spec:
      containers:
        - name: nginx
          image: mystore-frontend:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
# Open the store at http://localhost:30080
apiVersion: v1
kind: Service
metadata:
  name: mystore-frontend
  labels:
    app: mystore-frontend
spec:
  type: NodePort
  selector:
    app: mystore-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mystore-frontend-pdb
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: mystore-frontend
